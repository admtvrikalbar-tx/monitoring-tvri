<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVRI MONITORING | RESPONSIVE MOBILE & PC</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { 
            --accent: #38bdf8;
            --overlay-bg: rgba(15, 23, 42, 0.75);
            --amber: #fbce7c;
        }

        * { box-sizing: border-box; }

        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background-color: #000; 
            overflow-x: hidden; 
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        /* Grid Default (Desktop / Landscape): 2x2 */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(2, 1fr); 
            width: 100vw; 
            height: 100vh; 
        }

        .video-box { 
            position: relative; 
            border: 0.5px solid #1e293b; 
            background: #000;
            width: 100%;
            height: 100%;
        }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Label Channel */
        .ch-label { 
            position: absolute; top: 10px; left: 10px; 
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            color: var(--accent); 
            padding: 4px 10px; 
            font-size: 10px; font-weight: 800; 
            border-radius: 4px; z-index: 10;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex; align-items: center; gap: 5px;
        }

        /* Overlay Informasi Tengah Bawah (Desktop) */
        .floating-center-info {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            background: var(--overlay-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 15px 30px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            width: 90%;
            max-width: 650px;
        }

        #date { 
            font-size: 11px; font-weight: 600; 
            color: var(--accent); letter-spacing: 1.5px;
            margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .clock-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .station-id {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            border-right: 2px solid var(--accent);
            padding-right: 12px;
        }

        #clock { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 26px; font-weight: 800; 
            color: #fff; line-height: 1;
        }

        .shift-details {
            font-size: 10px; font-weight: 500; color: var(--amber);
            text-transform: uppercase; letter-spacing: 0.5px;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .live-dot { height: 6px; width: 6px; background-color: #ef4444; border-radius: 50%; display: inline-block; animation: blink 1.2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* ================================================= */
        /* PENGATURAN KHUSUS HP PORTRAIT (Layar Sempit/Berdiri) */
        /* ================================================= */
        @media (max-width: 768px) {
            body, html {
                overflow-y: auto; /* Agar bisa di-scroll ke bawah di HP */
                height: auto;
            }

            /* Ubah grid jadi 1 kolom ke bawah */
            .grid-container {
                display: flex;
                flex-direction: column;
                width: 100vw;
                height: auto;
            }

            .video-box {
                width: 100vw;
                height: 56.25vw; /* Menjaga rasio video tetap 16:9 di HP portrait */
                margin-bottom: 5px;
            }

            /* Panel informasi menyesuaikan agar tidak menutupi video terlalu banyak */
            .floating-center-info {
                position: relative;
                bottom: auto;
                left: auto;
                transform: none;
                width: 95%;
                margin: 10px auto;
                padding: 12px 15px;
                backdrop-filter: blur(10px);
            }

            .clock-row {
                flex-direction: column;
                gap: 5px;
            }

            .station-id {
                border-right: none;
                padding-right: 0;
                font-size: 12px;
            }

            #clock {
                font-size: 22px;
            }

            .shift-details {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <div class="floating-center-info">
        <div id="date">MEMUAT TANGGAL...</div>
        <div class="clock-row">
            <div class="station-id">TVRI KALBAR | PONTIANAK</div>
            <div id="clock">00:00:00 WIB</div>
        </div>
        <div id="shift-display" class="shift-details">MENUNGGU DATA OPERATOR...</div>
    </div>

    <div class="grid-container">
        <div class="video-box">
            <div class="ch-label"><span class="live-dot"></span> NASIONAL (AUTO)</div>
            <video id="v1" controls muted autoplay playsinline></video>
        </div>
        <div class="video-box">
            <div class="ch-label"><span class="live-dot"></span> SPORT (AUTO)</div>
            <video id="v2" controls muted autoplay playsinline></video>
        </div>
        <div class="video-box">
            <div class="ch-label"><span class="live-dot"></span> WORLD (AUTO)</div>
            <video id="v3" controls muted autoplay playsinline></video>
        </div>
        <div class="video-box">
            <div class="ch-label"><span class="live-dot"></span> KALBAR (AUTO)</div>
            <video id="v4" controls muted autoplay playsinline></video>
        </div>
    </div>

    <script>
        const dataJadwal = {
            "7":  {"1": "Ilham Sidik, Ahmad Wildan, Ramadhan Surya, Ibnu Sulthan", "2": "Hanevi Azhar, Surya Darma, Sangaji, Rizky Ramdhani, Ikbal", "3": "Usman, Merdi Tri"},
            "8":  {"1": "Edi Kurniadi, Ramadhani, Ilham Sidik, Ahmad Wildan", "2": "Usman, Merdi Tri", "3": "Hanevi Azhar, Surya Darma, Sangaji"},
            "9":  {"1": "Ahmad Wildan, Ramadhan Surya, Ibnu Sulthan, Sangaji", "2": "Edi Kurniadi, Ramadhani, Ilham Sidik", "3": "Usman, Merdi Tri"},
            "10": {"1": "Ramadhan Surya, Ibnu Sulthan, Sangaji", "2": "Ahmad Wildan, Ramadhan Surya, Ibnu Sulthan", "3": "Edi Kurniadi, Ramadhani, Ilham Sidik"},
            "11": {"1": "Edi Kurniadi, Ramadhani, Ilham Sidik", "2": "Sangaji", "3": "Ahmad Wildan, Ramadhan Surya, Ibnu Sulthan"},
            "12": {"1": "Ahmad Wildan, Ramadhan Surya, Ibnu Sulthan", "2": "Edi Kurniadi, Ramadhani, Ilham Sidik, Rizky, Ikbal", "3": "Sangaji"},
            "13": {"1": "Sangaji, Ibnu Sulthan", "2": "Ahmad Wildan, Ramadhan Surya", "3": "Edi Kurniadi, Ramadhani, Ilham Sidik, Usman, Merdi Tri"}
        };

        function updateUI() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID') + " WIB";
            const opsiTgl = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('id-ID', opsiTgl).toUpperCase();
            
            const tgl = now.getDate();
            const jam = now.getHours();
            let shift = (jam >= 0 && jam < 8) ? "1" : (jam >= 8 && jam < 16) ? "2" : "3";
            let jamShift = (shift === "1") ? "00:00 - 08:00" : (shift === "2") ? "08:00 - 16:00" : "16:00 - 00:00";
            let petugas = dataJadwal[tgl] ? dataJadwal[tgl][shift] : "DATA TIDAK TERSEDIA";
            document.getElementById('shift-display').innerText = `SHIFT ${shift} (${jamShift}) • OPERATOR: ${petugas}`;
        }

        setInterval(updateUI, 1000);
        updateUI();

        const streams = [
            { id: 'v1', url: 'https://ott-balancer.tvri.go.id/live/eds/Nasional/hls/Nasional.m3u8' },
            { id: 'v2', url: 'https://ott-balancer.tvri.go.id/live/eds/SportHD/hls/SportHD.m3u8' },
            { id: 'v3', url: 'https://ott-balancer.tvri.go.id/live/eds/TVRIWorld/hls/TVRIWorld.m3u8' },
            { id: 'v4', url: 'https://ott-balancer.tvri.go.id/live/eds/Kalbar/hls/Kalbar.m3u8' }
        ];

        streams.forEach(s => {
            const v = document.getElementById(s.id);
            if (Hls.isSupported()) {
                const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(s.url);
                hls.attachMedia(v);
                hls.on(Hls.Events.MANIFEST_PARSED, () => v.play());
            } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
                v.src = s.url;
            }
        });
    </script>
</body>
</html>
